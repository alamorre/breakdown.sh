name: Breakdown Local v1.0.0 release recovery
run-name: Recover exact Breakdown Local v1.0.0 ceremony 32391936576

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation shown in the issue #200 recovery runbook
        required: true
        type: string

permissions:
  actions: write
  attestations: read
  contents: read

concurrency:
  group: breakdown-local-v1-release-recovery
  cancel-in-progress: false

jobs:
  verify-and-continue:
    name: Verify retained evidence and continue the exact authorized ceremony
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'alamorre' && github.triggering_actor == 'alamorre' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: breakdown-local-authorization
    steps:
      - name: Require the exact recovery confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'CONTINUE EXACT BREAKDOWN LOCAL 1.0.0 FROM CEREMONY 32391936576 WITHOUT RETAGGING'

      - name: Check out the reviewed recovery implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          cache: pnpm
          package-manager-cache: false

      - name: Install the locked recovery verifier
        run: pnpm install --frozen-lockfile

      - name: Resolve every immutable recovery input before downloading bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32391936576" > "${{ runner.temp }}/ceremony-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32388197461" > "${{ runner.temp }}/qualification-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9415176744" > "${{ runner.temp }}/plan-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9415223409" > "${{ runner.temp }}/authorization-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9413780200" > "${{ runner.temp }}/candidate-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9413912347" > "${{ runner.temp }}/platform-artifact.json"

      - name: Download the exact retained ceremony plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 9415176744
          github-token: ${{ github.token }}
          run-id: 32391936576
          path: ${{ runner.temp }}/plan

      - name: Download the exact retained authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 9415223409
          github-token: ${{ github.token }}
          run-id: 32391936576
          path: ${{ runner.temp }}/authorization

      - name: Download the exact once-built candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 9413780200
          github-token: ${{ github.token }}
          run-id: 32388197461
          path: ${{ runner.temp }}/candidate

      - name: Download the exact passing platform index
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 9413912347
          github-token: ${{ github.token }}
          run-id: 32388197461
          path: ${{ runner.temp }}/platform

      - name: Resolve the one retained file of each required kind
        shell: bash
        run: |
          set -euo pipefail
          resolve_one() {
            local root="$1"
            local name="$2"
            mapfile -t matches < <(find "$root" -type f -name "$name" -print)
            test "${#matches[@]}" -eq 1
            printf '%s' "${matches[0]}"
          }
          printf 'AUTHORIZATION=%s\n' "$(resolve_one "${{ runner.temp }}/authorization" breakdown-github-release-authorization.json)" >> "$GITHUB_ENV"
          printf 'AUTHORIZATION_ATTESTATION=%s\n' "$(resolve_one "${{ runner.temp }}/authorization" breakdown-github-release-authorization.attestation.json)" >> "$GITHUB_ENV"
          printf 'PLAN=%s\n' "$(resolve_one "${{ runner.temp }}/plan" breakdown-release-ceremony-plan.json)" >> "$GITHUB_ENV"
          printf 'PLATFORM_INDEX=%s\n' "$(resolve_one "${{ runner.temp }}/platform" breakdown-platform-evidence-index.json)" >> "$GITHUB_ENV"

      - name: Verify the original authorization attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "$AUTHORIZATION" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$AUTHORIZATION_ATTESTATION" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/local-release-ceremony.yml" \
            --source-ref refs/heads/main \
            --source-digest 723e296c5a0ab5431a02022830adff8bcf0dd818 \
            --deny-self-hosted-runners

      - name: Install the pinned keyless annotated-tag verifier
        shell: bash
        run: |
          set -euo pipefail
          version=0.17.1
          binary="gitsign_${version}_linux_amd64"
          curl --fail --silent --show-error --location "https://github.com/sigstore/gitsign/releases/download/v${version}/${binary}" --output "${{ runner.temp }}/gitsign"
          (cd "${{ runner.temp }}" && printf '69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae  gitsign\n' | sha256sum --check --strict -)
          chmod 0755 "${{ runner.temp }}/gitsign"

      - name: Verify the immutable tag identity, issuer, signature, and Rekor entry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=breakdown-local-v1.0.0
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          verification_status=0
          "${{ runner.temp }}/gitsign" verify-tag \
            --certificate-identity 'https://github.com/alamorre/breakdown.sh/.github/workflows/local-release-ceremony.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$tag" > "${{ runner.temp }}/gitsign-verification.log" 2>&1 || verification_status=$?
          cat "${{ runner.temp }}/gitsign-verification.log"
          test "$verification_status" -eq 0
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > "${{ runner.temp }}/tag-ref.json"
          test "$(jq -er 'select(.object.type == "tag") | .object.sha' "${{ runner.temp }}/tag-ref.json")" = 222766090da2ad070e8b45619d8f0f844829144f
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/222766090da2ad070e8b45619d8f0f844829144f" > "${{ runner.temp }}/tag-object.json"
          jq -n \
            --arg log_sha256 "$(sha256sum "${{ runner.temp }}/gitsign-verification.log" | cut -d' ' -f1)" \
            '{
              method: "sigstore-keyless-gitsign",
              tag_verifier: "verify-tag",
              gitsign_version: "0.17.1",
              binary_sha256: "69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae",
              certificate_identity: "https://github.com/alamorre/breakdown.sh/.github/workflows/local-release-ceremony.yml@refs/heads/main",
              certificate_oidc_issuer: "https://token.actions.githubusercontent.com",
              transparency_log: "https://rekor.sigstore.dev",
              signature_verified: true,
              certificate_claims_verified: true,
              transparency_log_verified: true,
              verification_log_sha256: $log_sha256
            }' > "${{ runner.temp }}/signer.json"

      - name: Verify every exact retained binding and complete tag message
        shell: bash
        run: |
          set -euo pipefail
          pnpm local:release:verify-v1-recovery \
            --candidate "${{ runner.temp }}/candidate" \
            --platform-index "$PLATFORM_INDEX" \
            --candidate-artifact "${{ runner.temp }}/candidate-artifact.json" \
            --platform-artifact "${{ runner.temp }}/platform-artifact.json" \
            --qualification-run "${{ runner.temp }}/qualification-run.json" \
            --ceremony-run "${{ runner.temp }}/ceremony-run.json" \
            --plan "$PLAN" \
            --plan-artifact "${{ runner.temp }}/plan-artifact.json" \
            --authorization "$AUTHORIZATION" \
            --authorization-artifact "${{ runner.temp }}/authorization-artifact.json" \
            --tag-ref "${{ runner.temp }}/tag-ref.json" \
            --tag-object "${{ runner.temp }}/tag-object.json" \
            --signer "${{ runner.temp }}/signer.json" \
            --gitsign-log "${{ runner.temp }}/gitsign-verification.log" \
            --output "${{ runner.temp }}/breakdown-release-recovery-verification.json"

      - name: Retain recovery and Gitsign diagnostics before continuation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-release-recovery-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/breakdown-release-recovery-verification.json
            ${{ runner.temp }}/gitsign-verification.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Verify the exact retained successful host-support run and artifact
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32406103756" > "${{ runner.temp }}/host-support-run.json"
          jq -e \
            '.id == 32406103756 and
             .workflow_id == 323419478 and
             .display_title == "Breakdown Local host support for ceremony 32391936576" and
             .event == "workflow_dispatch" and
             .path == ".github/workflows/local-host-support.yml" and
             .head_branch == "breakdown-local-v1.0.0" and
             .head_sha == "723e296c5a0ab5431a02022830adff8bcf0dd818" and
             .actor.login == "github-actions[bot]" and
             .triggering_actor.login == "github-actions[bot]" and
             .run_attempt == 1 and
             .status == "completed" and
             .conclusion == "success"' \
            "${{ runner.temp }}/host-support-run.json" > /dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9420331832" > "${{ runner.temp }}/host-support-artifact.json"
          jq -e \
            '.id == 9420331832 and
             .name == "breakdown-host-support" and
             .expired == false and
             .digest == "sha256:a29b6fb317ce1b94be4e704113dced212e2680e4f06538fcec55b8d1d85928da" and
             .workflow_run.id == 32406103756 and
             .workflow_run.head_branch == "breakdown-local-v1.0.0" and
             .workflow_run.head_sha == "723e296c5a0ab5431a02022830adff8bcf0dd818"' \
            "${{ runner.temp }}/host-support-artifact.json" > /dev/null
          printf 'artifact_id=9420331832\n' >> "$GITHUB_OUTPUT"
          printf 'run_id=32406103756\n' >> "$GITHUB_OUTPUT"

      - name: Dispatch or resume the one correlated protected stable-publication run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            printf '::error::%s\n' "$*" >&2
            exit 1
          }
          list_runs() {
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/323419480/runs?per_page=100" > "$1"
          }
          read_publication_state() {
            local release_exists=false
            local release_error="${{ runner.temp }}/github-release-error.log"
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/breakdown-local-v1.0.0" > "${{ runner.temp }}/github-release.json" 2> "$release_error"; then
              release_exists=true
            else
              rg --fixed-strings 'HTTP 404' "$release_error" > /dev/null || fail "Could not determine GitHub Release state."
            fi
            local core_exists
            local cli_exists
            local mcp_exists
            package_exists() {
              local key="$1"
              local encoded_name="$2"
              local status
              status="$(curl --silent --show-error --location \
                --output "${{ runner.temp }}/npm-${key}.json" \
                --write-out '%{http_code}' \
                "https://registry.npmjs.org/${encoded_name}")"
              case "$status" in
                200) printf true ;;
                404) printf false ;;
                *) fail "Could not determine npm state for ${encoded_name}; registry returned HTTP ${status}." ;;
              esac
            }
            core_exists="$(package_exists core '@breakdown-sh%2fcore')"
            cli_exists="$(package_exists cli '@breakdown-sh%2fcli')"
            mcp_exists="$(package_exists mcp '@breakdown-sh%2fmcp')"
            jq -n \
              --argjson release "$release_exists" \
              --argjson core "$core_exists" \
              --argjson cli "$cli_exists" \
              --argjson mcp "$mcp_exists" \
              '{
                github_release_exists: $release,
                npm_packages: {
                  "@breakdown-sh/core": $core,
                  "@breakdown-sh/cli": $cli,
                  "@breakdown-sh/mcp": $mcp
                }
              }' > "$1"
          }
          create_plan() {
            pnpm local:release:plan-v1-handoff \
              --runs "$1" \
              --publication-state "$2" \
              --output "$3"
          }

          runs_file="${{ runner.temp }}/stable-publication-runs-before.json"
          state_file="${{ runner.temp }}/stable-publication-state.json"
          plan_file="${{ runner.temp }}/stable-publication-handoff-before.json"
          list_runs "$runs_file"
          read_publication_state "$state_file"
          create_plan "$runs_file" "$state_file" "$plan_file"

          action="$(jq -er '.action' "$plan_file")"
          if test "$action" = dispatch; then
            request_file="${{ runner.temp }}/stable-publication-dispatch.json"
            response_file="${{ runner.temp }}/stable-publication-dispatch-response.json"
            jq -e '.dispatch' "$plan_file" > "$request_file"
            if ! gh api \
              --method POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/323419480/dispatches" \
              --input "$request_file" > "$response_file"; then
              fail 'Stable-publication workflow dispatch failed. It was not retried.'
            fi
            run_id="$(jq -er '.workflow_run_id | select(type == "number" and . > 0) | tostring' "$response_file")" || fail 'Stable-publication dispatch did not return a run ID; do not retry blindly.'
            run_url="$(jq -er '.html_url | select(type == "string")' "$response_file")" || fail 'Stable-publication dispatch did not return a run URL; do not retry blindly.'
            test "$run_url" = "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || fail 'Stable-publication dispatch returned a mismatched run URL; do not retry blindly.'
            printf '::notice::Dispatched the exact stable-publication run: %s\n' "$run_url"

            runs_after_file="${{ runner.temp }}/stable-publication-runs-after.json"
            plan_after_file="${{ runner.temp }}/stable-publication-handoff-after.json"
            list_runs "$runs_after_file"
            create_plan "$runs_after_file" "$state_file" "$plan_after_file"
            test "$(jq -er '.action' "$plan_after_file")" = resume || fail "The dispatched run could not be correlated: ${run_url}"
            test "$(jq -er '.run.id' "$plan_after_file")" = "$run_id" || fail "The dispatch response and correlated run disagree: ${run_url}"
          elif test "$action" = resume; then
            run_id="$(jq -er '.run.id' "$plan_file")"
            run_url="$(jq -er '.run.url' "$plan_file")"
            printf '::notice::Resuming the one exact stable-publication run: %s\n' "$run_url"
          else
            fail "Unexpected stable-publication handoff action: ${action}"
          fi

          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          status="$(jq -er '.status' <<< "$run")"
          conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
          minimum_run_attempt="$(jq -er '.run_attempt' <<< "$run")"
          if test "$status" = completed && test "$conclusion" != success; then
            if [[ "$conclusion" != failure && "$conclusion" != cancelled && "$conclusion" != timed_out ]]; then
              fail "Stable-publication run cannot be safely resumed after conclusion ${conclusion}: ${run_url}"
            fi
            printf '::notice::Rerunning failed attempt %s of the exact stable-publication run: %s\n' "$minimum_run_attempt" "$run_url"
            gh run rerun "$run_id"
            minimum_run_attempt="$((minimum_run_attempt + 1))"
          fi

          completed=false
          last_state=''
          for attempt in $(seq 1 240); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            run_attempt="$(jq -er '.run_attempt' <<< "$run")"
            status="$(jq -er '.status' <<< "$run")"
            current_state="attempt ${run_attempt}: ${status}"
            if test "$current_state" != "$last_state"; then
              printf 'Stable-publication %s (%s)\n' "$current_state" "$run_url"
              last_state="$current_state"
            fi
            if test "$run_attempt" -ge "$minimum_run_attempt" && test "$status" = completed; then
              conclusion="$(jq -er '.conclusion' <<< "$run")"
              test "$conclusion" = success || fail "Stable-publication run concluded ${conclusion}: ${run_url}"
              completed=true
              break
            fi
            sleep 5
          done
          test "$completed" = true || fail "Timed out waiting for stable publication: ${run_url}"
          printf '## Exact v1.0.0 recovery continuation complete\n\nHost support run: `%s`. Host support artifact: `%s`. First-package bootstrap run: [%s](%s). Immutable tag: `%s`. No tag was created or changed by this recovery.\n' \
            '${{ steps.host.outputs.run_id }}' '${{ steps.host.outputs.artifact_id }}' "$run_id" "$run_url" breakdown-local-v1.0.0 >> "$GITHUB_STEP_SUMMARY"

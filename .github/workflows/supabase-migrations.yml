name: Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview migrations without applying them.
        required: true
        type: boolean
        default: true
      include_all:
        description: Include all migrations, including unapplied remote history repairs.
        required: true
        type: boolean
        default: false
      doppler_project:
        description: Doppler project to fetch migration secrets from.
        required: true
        type: string
        default: breakdown-sh
      doppler_config:
        description: Doppler config to fetch migration secrets from.
        required: true
        type: choice
        default: dev
        options:
          - dev
          - stg
          - prd

permissions:
  contents: read
  id-token: write

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    env:
      DOPPLER_SERVICE_IDENTITY_ID: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
    steps:
      - name: Require Doppler identity
        run: |
          set -euo pipefail

          if [ -z "${DOPPLER_SERVICE_IDENTITY_ID:-}" ]; then
            echo "::error::DOPPLER_SERVICE_IDENTITY_ID repository variable is required."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fetch migration secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: ${{ inputs.doppler_project }}
          doppler-config: ${{ inputs.doppler_config }}
          inject-env-vars: true

      - name: Require Supabase migration secrets
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required in Doppler config '${{ inputs.doppler_config }}'."
              missing=1
            fi
          done

          exit "$missing"

      - name: Link Supabase project
        run: |
          set -euo pipefail

          supabase --version
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: |
          set -euo pipefail

          args=(db push --linked)

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
            echo "Running Supabase migration dry run."
          else
            args+=(--yes)
            echo "Applying Supabase migrations."
          fi

          if [ "${{ inputs.include_all }}" = "true" ]; then
            args+=(--include-all)
            echo "Including all migrations."
          fi

          supabase "${args[@]}"

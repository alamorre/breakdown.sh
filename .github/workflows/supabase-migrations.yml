name: Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview migrations without applying them.
        required: true
        type: boolean
        default: true
      include_all:
        description: Include all migrations, including unapplied remote history repairs.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Require Supabase secrets
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name repository secret is required."
              missing=1
            else
              echo "::add-mask::${!name}"
            fi
          done

          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: |
          set -euo pipefail

          supabase --version
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: |
          set -euo pipefail

          args=(db push --linked)

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
            echo "Running Supabase migration dry run."
          else
            args+=(--yes)
            echo "Applying Supabase migrations."
          fi

          if [ "${{ inputs.include_all }}" = "true" ]; then
            args+=(--include-all)
            echo "Including all migrations."
          fi

          supabase "${args[@]}"

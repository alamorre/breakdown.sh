name: Supabase Migrations

# Hosted-legacy / self-host only — not required for Breakdown Local (see docs/roadmap.md and
# docs/adr/0004-declare-breakdown-local-canonical-and-retire-doppler-hosted-legacy.md).
# File-local secrets are canonical for Local; this workflow remains for SaaS self-host operators
# who manage Supabase credentials via GitHub Environment secrets.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview migrations without applying them.
        required: true
        type: boolean
        default: true
      include_all:
        description: Include all migrations, including unapplied remote history repairs.
        required: true
        type: boolean
        default: false
      github_environment:
        description: GitHub Environment that holds SUPABASE_* secrets and approval gates.
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require Supabase migration secrets
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required as a secret in GitHub Environment '${{ inputs.github_environment }}'."
              missing=1
            fi
          done

          exit "$missing"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Link Supabase project
        run: |
          set -euo pipefail

          supabase --version
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: |
          set -euo pipefail

          args=(db push --linked)

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
            echo "Running Supabase migration dry run."
          else
            args+=(--yes)
            echo "Applying Supabase migrations."
          fi

          if [ "${{ inputs.include_all }}" = "true" ]; then
            args+=(--include-all)
            echo "Including all migrations."
          fi

          supabase "${args[@]}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

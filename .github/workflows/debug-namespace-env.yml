name: Debug Namespace env (TEMPORARY)
# TEMPORARY diagnostic workflow - deleted before merge.

on:
  push:
    branches:
      - cursor/namespace-pr-checks-ci-c12a
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug:
    name: Probe tmp filesystem behavior
    runs-on: namespace-profile-breakdown-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core and CLI
        run: pnpm --filter @breakdown-sh/core --filter @breakdown-sh/cli build

      - name: Run tmp probe
        run: node ./debug-namespace-tmp.mjs

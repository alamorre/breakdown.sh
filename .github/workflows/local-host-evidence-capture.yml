name: Breakdown Local unattended guided-host qualification

on:
  workflow_dispatch:
    inputs:
      platform_run_id:
        description: Workflow run ID that produced the exact candidate and platform index
        required: true
        type: string
      candidate_artifact_id:
        description: Immutable artifact ID for the exact platform-qualified candidate
        required: true
        type: string
      platform_index_artifact_id:
        description: Immutable artifact ID for the matching passing platform index
        required: true
        type: string

permissions:
  actions: read
  contents: read
  copilot-requests: write

env:
  COPILOT_AUTO_UPDATE: 'false'

jobs:
  execute:
    name: Execute ${{ matrix.row }} in a real CLI Agent Host
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: linux-gpt
            runner: ubuntu-24.04
            os: linux
            model: gpt-5.3-codex
            provider: openai
          - row: macos-mai
            runner: macos-15
            os: macos
            model: mai-code-1-flash
            provider: microsoft
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the reviewed qualification boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
          package-manager-cache: false

      - name: Install locked harness dependencies and exact Agent Host
        run: |
          pnpm install --frozen-lockfile
          npm install --global @github/copilot@1.0.77
          test "$(copilot --version | sed -n -e '1s/^GitHub Copilot CLI //' -e '1s/\.$//p' | tr -d '\r')" = "1.0.77"

      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.platform_run_id }}
          path: ${{ runner.temp }}/breakdown-candidate

      - name: Download the matching passing platform index
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.platform_index_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.platform_run_id }}
          path: ${{ runner.temp }}/platform-index

      - name: Verify the candidate is fully platform-qualified
        run: pnpm local:release:verify-host-prerequisites --candidate "${{ runner.temp }}/breakdown-candidate" --platform-index "${{ runner.temp }}/platform-index/breakdown-platform-evidence-index.json" --source-commit "$GITHUB_SHA"

      - name: Conduct the complete authorized journey and retain sanitized evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm local:release:execute-host --candidate "${{ runner.temp }}/breakdown-candidate" --output "${{ runner.temp }}/host-execution" --row "${{ matrix.row }}" --expected-os "${{ matrix.os }}" --model "${{ matrix.model }}" --provider "${{ matrix.provider }}" --copilot-version 1.0.77 --source-commit "$GITHUB_SHA"

      - name: Retain execution evidence for a fresh review job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: breakdown-host-execution-${{ matrix.row }}
          path: ${{ runner.temp }}/host-execution
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  review:
    name: Independently review ${{ matrix.row }} from a fresh context
    needs: execute
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: linux-gpt
            execution_model: gpt-5.3-codex
            review_model: mai-code-1-flash
            review_provider: microsoft
          - row: macos-mai
            execution_model: mai-code-1-flash
            review_model: gpt-5.3-codex
            review_provider: openai
    runs-on: ubuntu-24.04
    env:
      BREAKDOWN_HOST_EVIDENCE_ARTIFACT_NAME: breakdown-host-evidence-${{ matrix.row }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the independent review boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
          package-manager-cache: false

      - name: Install locked review dependencies and exact Agent Host
        run: |
          pnpm install --frozen-lockfile
          npm install --global @github/copilot@1.0.77
          test "$(copilot --version | sed -n -e '1s/^GitHub Copilot CLI //' -e '1s/\.$//p' | tr -d '\r')" = "1.0.77"

      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.platform_run_id }}
          path: ${{ runner.temp }}/breakdown-candidate

      - name: Download only this row's immutable execution evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: breakdown-host-execution-${{ matrix.row }}
          path: ${{ runner.temp }}/host-execution

      - name: Review in a distinct fresh Agent Host context and bind the row
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm local:release:review-host --candidate "${{ runner.temp }}/breakdown-candidate" --execution "${{ runner.temp }}/host-execution" --output "${{ runner.temp }}/qualified-host-row" --row "${{ matrix.row }}" --model "${{ matrix.review_model }}" --provider "${{ matrix.review_provider }}" --copilot-version 1.0.77 --source-commit "$GITHUB_SHA"

      - name: Qualify the exact independently reviewed row
        run: pnpm local:release:qualify-host --candidate "${{ runner.temp }}/breakdown-candidate" --submission "${{ runner.temp }}/qualified-host-row/guided-host-submission.json" --output "${{ runner.temp }}/qualified-host-row/guided-host-evidence.json"

      - name: Retain the current-run qualified row
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BREAKDOWN_HOST_EVIDENCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/qualified-host-row
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

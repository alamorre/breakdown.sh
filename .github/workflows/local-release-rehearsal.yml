name: Breakdown Local release operation rehearsal
run-name: >-
  Rehearse ${{ inputs.operation_id || 'breakdown-release-f36df7cb0ec89bdd73bac9c2751d21ee3c1792118fc47a19ff6fdf1bb09e254d' }}
  on ${{ inputs.head_sha || github.event.pull_request.head.sha }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact development commit containing the rehearsal implementation
        required: true
        type: string
      operation_id:
        description: Immutable release operation ID printed by the controller
        required: true
        type: string
      scenario:
        description: Passing rehearsal or retained intentional pre-publication failure
        required: true
        default: pass
        type: choice
        options:
          - pass
          - intentional-failure

permissions:
  contents: read

concurrency:
  group: breakdown-local-release-rehearsal-${{ inputs.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  rehearse:
    name: Exercise every repository-owned gate through pre-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_OPERATION_ID: breakdown-release-f36df7cb0ec89bdd73bac9c2751d21ee3c1792118fc47a19ff6fdf1bb09e254d
      OPERATION_ID: ${{ inputs.operation_id || 'breakdown-release-f36df7cb0ec89bdd73bac9c2751d21ee3c1792118fc47a19ff6fdf1bb09e254d' }}
      SCENARIO: ${{ inputs.scenario || 'pass' }}
      TARGET_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact development commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          package-manager-cache: false

      - name: Require the exact operation and development commit
        shell: bash
        run: |
          set -euo pipefail
          test "$OPERATION_ID" = "$EXPECTED_OPERATION_ID"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$TARGET_SHA" = "$GITHUB_SHA"
          fi

      - name: Exercise shared pre-publication gates with a deliberately minimal PATH
        shell: bash
        run: >-
          node scripts/run-minimal-release-rehearsal.mjs
          --scenario "$SCENARIO"
          --workflow-sha "$TARGET_SHA"
          --controller-run-id "$GITHUB_RUN_ID"
          --output "${{ runner.temp }}/breakdown-release-rehearsal-result.json"

      - name: Retain sanitized rehearsal diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/breakdown-release-rehearsal-result.json
          if-no-files-found: error
          retention-days: 90

name: Plugin Release Commands

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plugin-release-command-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  command:
    name: Command
    if: >
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/bump') ||
        contains(github.event.comment.body, '/promote') ||
        contains(github.event.comment.body, '/file-regressions'))
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          actor_permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq '.permission' 2>/dev/null || echo none)"
          case "${actor_permission}" in
            admin|maintain|write) ;;
            *)
              echo "Release commands require write, maintain, or admin permission. Received: ${actor_permission}" >&2
              exit 1
              ;;
          esac

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(PR_JSON="${pr_json}" node -e "const pr = JSON.parse(process.env.PR_JSON); process.stdout.write(pr.head.repo.full_name)")"
          head_ref="$(PR_JSON="${pr_json}" node -e "const pr = JSON.parse(process.env.PR_JSON); process.stdout.write(pr.head.ref)")"
          head_sha="$(PR_JSON="${pr_json}" node -e "const pr = JSON.parse(process.env.PR_JSON); process.stdout.write(pr.head.sha)")"

          if [ "${head_repo}" != "${GITHUB_REPOSITORY}" ]; then
            echo "Release commands with write credentials only run for same-repository PR branches." >&2
            exit 1
          fi

          {
            echo "number=${PR_NUMBER}"
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse release command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node scripts/plugin-release-command.mjs parse

      - name: Stop when command is unsupported
        if: steps.command.outputs.should_run != 'true'
        run: echo "${{ steps.command.outputs.reason }}"

      - name: Configure git author
        if: steps.command.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply bump command
        if: steps.command.outputs.command == 'bump'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          LEVEL: ${{ steps.command.outputs.level }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail

          node scripts/plugin-version.mjs "${LEVEL}"
          next_version="$(node -e "const fs = require('node:fs'); const manifest = JSON.parse(fs.readFileSync('plugins/breakdown/.codex-plugin/plugin.json', 'utf8')); process.stdout.write(manifest.version);")"

          git add plugins/breakdown/.codex-plugin/plugin.json
          if git diff --cached --quiet; then
            gh pr comment "${PR_NUMBER}" --body "Plugin version is already at ${next_version}; no bump commit was created."
            exit 0
          fi

          git commit -m "Bump Breakdown plugin to ${next_version}"
          git push origin "HEAD:${HEAD_REF}"
          gh pr comment "${PR_NUMBER}" --body "Bumped Breakdown plugin candidate to \`${next_version}\`. Run \`/release-test\` when ready."

      - name: Promote candidate baseline
        if: steps.command.outputs.command == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPORT_PATH: ${{ steps.command.outputs.report_path }}
          BASELINE_PATH: ${{ steps.command.outputs.baseline_path }}
          ACCEPT_KNOWN_ISSUES: ${{ steps.command.outputs.accepted_known_issues }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          TESTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          if [ ! -f "${REPORT_PATH}" ]; then
            gh pr comment "${PR_NUMBER}" --body "Promotion report \`${REPORT_PATH}\` was not found. Commit or restore the release-test JSON, then rerun \`/promote\`."
            exit 1
          fi

          promote_args=(promote --report "${REPORT_PATH}" --baseline "${BASELINE_PATH}" --pr "${PR_NUMBER}" --sha "${TESTED_SHA}")
          if [ "${ACCEPT_KNOWN_ISSUES}" = "true" ]; then
            promote_args+=(--accept-known-issues)
          fi

          node scripts/plugin-release-command.mjs "${promote_args[@]}"
          version="$(node -e "const fs = require('node:fs'); const baseline = JSON.parse(fs.readFileSync(process.env.BASELINE_PATH, 'utf8')); process.stdout.write(baseline.candidate.version)")"

          git add "${BASELINE_PATH}"
          git commit -m "Promote Breakdown plugin ${version}"
          git tag "breakdown-plugin-v${version}" "${TESTED_SHA}"
          git push origin "HEAD:${HEAD_REF}"
          git push origin "breakdown-plugin-v${version}"
          gh pr comment "${PR_NUMBER}" --body "Promoted Breakdown plugin \`${version}\` and preserved tested ref \`${TESTED_SHA}\` in \`${BASELINE_PATH}\`."

      - name: File regression issues
        if: steps.command.outputs.command == 'file-regressions'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPORT_PATH: ${{ steps.command.outputs.report_path }}
        run: |
          set -euo pipefail

          if [ ! -f "${REPORT_PATH}" ]; then
            gh pr comment "${PR_NUMBER}" --body "Regression report \`${REPORT_PATH}\` was not found. Commit or restore the release-test JSON, then rerun \`/file-regressions\`."
            exit 1
          fi

          node scripts/plugin-release-command.mjs regressions --report "${REPORT_PATH}" --out /tmp/plugin-release-regressions.json
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const issues = JSON.parse(fs.readFileSync('/tmp/plugin-release-regressions.json', 'utf8'));

          for (const issue of issues) {
            const args = ['issue', 'create', '--title', issue.title, '--body', issue.body];
            for (const label of issue.labels ?? []) {
              args.push('--label', label);
            }
            const result = spawnSync('gh', args, { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE

          count="$(node -e "const fs = require('node:fs'); const issues = JSON.parse(fs.readFileSync('/tmp/plugin-release-regressions.json', 'utf8')); process.stdout.write(String(issues.length));")"
          gh pr comment "${PR_NUMBER}" --body "Filed ${count} plugin release regression issue(s) from \`${REPORT_PATH}\`."

name: Breakdown Local release ceremony
run-name: Breakdown Local ${{ inputs.execution_mode }} ceremony for candidate ${{ inputs.candidate_artifact_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main SHA used by the fully qualified candidate
        required: true
        type: string
      candidate_artifact_id:
        description: Immutable breakdown-local-candidate artifact ID
        required: true
        type: string
      platform_index_artifact_id:
        description: Immutable passing platform-index artifact ID from the same run
        required: true
        type: string
      execution_mode:
        description: Stop at the signed authorization boundary or execute the release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - resume-publication
      npm_publication_mode:
        description: Exact npm authentication/publication path
        required: true
        default: oidc-trusted-publishing
        type: choice
        options:
          - oidc-trusted-publishing
          - first-package-bootstrap
          - finalize-bootstrap
      npm_trusted_publishing_artifact_id:
        description: Sanitized trust-inspection artifact ID required outside first-package bootstrap
        required: false
        type: string
      npm_bootstrap_artifact_id:
        description: Successful bootstrap evidence artifact ID required for finalization
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: breakdown-local-release-ceremony
  cancel-in-progress: false

jobs:
  plan:
    name: Verify and present the exact irreversible release plan
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'alamorre' && github.triggering_actor == 'alamorre' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      authorization_comment: ${{ steps.identity.outputs.authorization_comment }}
      candidate_digest: ${{ steps.identity.outputs.candidate_digest }}
      candidate_checksum_inventory_sha256: ${{ steps.identity.outputs.candidate_checksum_inventory_sha256 }}
      plan_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      plan_sha256: ${{ steps.identity.outputs.plan_sha256 }}
      release_version: ${{ steps.identity.outputs.release_version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          cache: pnpm
          package-manager-cache: false

      - name: Install the locked release verifier
        run: pnpm install --frozen-lockfile

      - name: Resolve immutable GitHub identities before downloading bytes
        env:
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          GH_TOKEN: ${{ secrets.RELEASE_CONTROL_READ_TOKEN || github.token }}
          PLATFORM_INDEX_ARTIFACT_ID: ${{ inputs.platform_index_artifact_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLATFORM_INDEX_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$CANDIDATE_ARTIFACT_ID" != "$PLATFORM_INDEX_ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' > "${{ runner.temp }}/current-main-sha"
          test "$(tr -d '\n' < "${{ runner.temp }}/current-main-sha")" = "$SOURCE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" > "${{ runner.temp }}/candidate-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PLATFORM_INDEX_ARTIFACT_ID}" > "${{ runner.temp }}/platform-artifact.json"
          qualification_run_id="$(jq -er '.workflow_run.id' "${{ runner.temp }}/candidate-artifact.json")"
          test "$qualification_run_id" = "$(jq -er '.workflow_run.id' "${{ runner.temp }}/platform-artifact.json")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}" > "${{ runner.temp }}/qualification-run.json"

      - name: Download the exact candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate

      - name: Download the exact platform index by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.platform_index_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/platform-index

      - name: Resolve one immutable platform index
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t indexes < <(find "${{ runner.temp }}/platform-index" -type f -name breakdown-platform-evidence-index.json -print)
          test "${#indexes[@]}" -eq 1
          printf 'PLATFORM_INDEX=%s\n' "${indexes[0]}" >> "$GITHUB_ENV"

      - name: Re-read every pre-tag GitHub control
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CONTROL_READ_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find "${{ runner.temp }}/candidate" -maxdepth 1 -type f -name 'breakdown-release-*.json' -print)
          test "${#manifests[@]}" -eq 1
          tag="breakdown-local-v$(jq -er '.release_version' "${manifests[0]}")"
          phase=pre-tag
          if test '${{ inputs.execution_mode }}' = resume-publication; then phase=publication; fi
          pnpm local:release:verify-github-controls --phase "$phase" --tag "$tag" --output "${{ runner.temp }}/breakdown-github-release-controls-pre-tag.json"

      - name: Build the candidate-bound release plan
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm local:release:plan-ceremony \
            --candidate "${{ runner.temp }}/candidate" \
            --platform-index "$PLATFORM_INDEX" \
            --candidate-artifact "${{ runner.temp }}/candidate-artifact.json" \
            --platform-artifact "${{ runner.temp }}/platform-artifact.json" \
            --qualification-run "${{ runner.temp }}/qualification-run.json" \
            --source-sha '${{ inputs.source_sha }}' \
            --current-main-sha "$(tr -d '\n' < "${{ runner.temp }}/current-main-sha")" \
            --candidate-artifact-id '${{ inputs.candidate_artifact_id }}' \
            --platform-index-artifact-id '${{ inputs.platform_index_artifact_id }}' \
            --execution-mode '${{ inputs.execution_mode }}' \
            --npm-publication-mode '${{ inputs.npm_publication_mode }}' \
            --npm-bootstrap-artifact-id '${{ inputs.npm_bootstrap_artifact_id }}' \
            --npm-trusted-publishing-artifact-id '${{ inputs.npm_trusted_publishing_artifact_id }}' \
            --ceremony-run-id "$GITHUB_RUN_ID" \
            --ceremony-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --output "${{ runner.temp }}/breakdown-release-ceremony-plan.json"

      - name: Present every exact value for authenticated review
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          plan="${{ runner.temp }}/breakdown-release-ceremony-plan.json"
          plan_sha256="$(sha256sum "$plan" | cut -d' ' -f1)"
          authorization_comment="APPROVE BREAKDOWN LOCAL PLAN SHA256 ${plan_sha256}"
          {
            printf 'plan_sha256=%s\n' "$plan_sha256"
            printf 'authorization_comment=%s\n' "$authorization_comment"
            printf 'release_version=%s\n' "$(jq -r '.release_version' "$plan")"
            printf 'tag=%s\n' "$(jq -r '.tag' "$plan")"
            printf 'source_sha=%s\n' "$(jq -r '.source.git_commit' "$plan")"
            printf 'candidate_digest=%s\n' "$(jq -r '.candidate.digest.content' "$plan")"
            printf 'candidate_checksum_inventory_sha256=%s\n' "$(jq -r '.candidate.checksum_inventory.sha256' "$plan")"
          } >> "$GITHUB_OUTPUT"
          {
            printf '# Breakdown Local release authorization\n\n'
            printf 'Review every value below. To authorize, approve the **breakdown-local-authorization** deployment and use this exact review comment:\n\n'
            printf '```text\n%s\n```\n\n' "$authorization_comment"
            printf '| Identity | Exact value |\n| --- | --- |\n'
            jq -r 'to_entries[] | "| `\(.key)` | `\(.value)` |"' <<EOF
          {
            "execution mode": "$(jq -r '.execution_mode' "$plan")",
            "version": "$(jq -r '.release_version' "$plan")",
            "tag": "$(jq -r '.tag' "$plan")",
            "source SHA": "$(jq -r '.source.git_commit' "$plan")",
            "candidate digest": "$(jq -r '.candidate.digest.content' "$plan")",
            "checksum inventory digest": "$(jq -r '.candidate.checksum_inventory.sha256' "$plan")",
            "candidate artifact ID": "$(jq -r '.artifact_ids.candidate' "$plan")",
            "platform index artifact ID": "$(jq -r '.artifact_ids.platform_index' "$plan")",
            "npm mode": "$(jq -r '.npm_publication_mode' "$plan")",
            "ceremony run ID": "$GITHUB_RUN_ID",
            "plan SHA-256": "$plan_sha256"
          }
          EOF
            printf '\n## Required attestations\n\n'
            jq -r '.human_authorization.attestations[] | "- [ ] `\(.)`"' "$plan"
            printf '\nDry runs stop after authorization. Execute runs create the protected tag and then operate the host-support and stable-publication workflows.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the immutable plan and pre-tag controls
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-release-ceremony-plan-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/breakdown-release-ceremony-plan.json
            ${{ runner.temp }}/breakdown-github-release-controls-pre-tag.json
          if-no-files-found: error
          retention-days: 90

  authorize:
    name: Authorize ${{ needs.plan.outputs.tag }} plan ${{ needs.plan.outputs.plan_sha256 }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: breakdown-local-authorization
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      authorization_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      authorization_sha256: ${{ steps.identity.outputs.authorization_sha256 }}
    steps:
      - name: Check out the exact authorization implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          cache: pnpm
          package-manager-cache: false

      - name: Install the locked authorization verifier
        run: pnpm install --frozen-lockfile

      - name: Download the reviewed plan from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/plan

      - name: Capture and validate the authenticated environment review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > "${{ runner.temp }}/approvals.json"
          pnpm local:release:authorize-ceremony \
            --plan "${{ runner.temp }}/plan/breakdown-release-ceremony-plan.json" \
            --approvals "${{ runner.temp }}/approvals.json" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "${{ runner.temp }}/breakdown-github-release-authorization.json"

      - name: Attest the exact GitHub-authenticated authorization
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/breakdown-github-release-authorization.json

      - name: Assemble authorization evidence without secrets
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir "${{ runner.temp }}/authorization"
          cp "${{ runner.temp }}/breakdown-github-release-authorization.json" "${{ runner.temp }}/authorization/breakdown-github-release-authorization.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ runner.temp }}/authorization/breakdown-github-release-authorization.attestation.json"
          authorization_sha256="$(sha256sum "${{ runner.temp }}/breakdown-github-release-authorization.json" | cut -d' ' -f1)"
          printf 'authorization_sha256=%s\n' "$authorization_sha256" >> "$GITHUB_OUTPUT"
          printf '## Authorized\n\nGitHub user `alamorre` authorized plan `%s` for `%s`. Authorization SHA-256: `%s`.\n' \
            '${{ needs.plan.outputs.plan_sha256 }}' '${{ needs.plan.outputs.tag }}' "$authorization_sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the authenticated authorization
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-release-authorization-${{ github.run_id }}
          path: ${{ runner.temp }}/authorization
          if-no-files-found: error
          retention-days: 90

  dry-run-boundary:
    name: Prove the complete ceremony up to the irreversible tag boundary
    if: ${{ inputs.execution_mode == 'dry-run' }}
    needs:
      - plan
      - authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Download the authenticated authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.authorize.outputs.authorization_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/authorization

      - name: Verify the authorization attestation and stop before tagging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "${{ runner.temp }}/authorization/breakdown-github-release-authorization.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "${{ runner.temp }}/authorization/breakdown-github-release-authorization.attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/local-release-ceremony.yml" \
            --source-ref refs/heads/main \
            --source-digest '${{ needs.plan.outputs.source_sha }}' \
            --deny-self-hosted-runners
          test '${{ needs.authorize.outputs.authorization_sha256 }}' = "$(sha256sum "${{ runner.temp }}/authorization/breakdown-github-release-authorization.json" | cut -d' ' -f1)"
          printf '## Dry run passed\n\nThe candidate, platform evidence, GitHub controls, exact plan, authenticated review, and authorization attestation passed. No tag, publication workflow, npm package, or GitHub Release was created.\n' >> "$GITHUB_STEP_SUMMARY"

  execute:
    name: Sign, protect, and operate the authorized release
    if: ${{ inputs.execution_mode == 'execute' || inputs.execution_mode == 'resume-publication' }}
    needs:
      - plan
      - authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      attestations: read
      contents: write
      id-token: write
    steps:
      - name: Check out the exact authorized source with tag history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          cache: pnpm
          package-manager-cache: false

      - name: Install the locked release implementation
        run: pnpm install --frozen-lockfile

      - name: Download the exact plan and authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }},${{ needs.authorize.outputs.authorization_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ceremony

      - name: Resolve and verify the authenticated authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_one() {
            local name="$1"
            mapfile -t matches < <(find "${{ runner.temp }}/ceremony" -type f -name "$name" -print)
            test "${#matches[@]}" -eq 1
            printf '%s' "${matches[0]}"
          }
          printf 'PLAN=%s\n' "$(resolve_one breakdown-release-ceremony-plan.json)" >> "$GITHUB_ENV"
          printf 'AUTHORIZATION=%s\n' "$(resolve_one breakdown-github-release-authorization.json)" >> "$GITHUB_ENV"
          printf 'AUTHORIZATION_ATTESTATION=%s\n' "$(resolve_one breakdown-github-release-authorization.attestation.json)" >> "$GITHUB_ENV"
          gh attestation verify "$(resolve_one breakdown-github-release-authorization.json)" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$(resolve_one breakdown-github-release-authorization.attestation.json)" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/local-release-ceremony.yml" \
            --source-ref refs/heads/main \
            --source-digest '${{ needs.plan.outputs.source_sha }}' \
            --deny-self-hosted-runners

      - name: Re-read controls at the irreversible boundary
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CONTROL_READ_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.plan.outputs.tag }}'
          phase=pre-tag
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            phase=publication
          else
            test '${{ inputs.execution_mode }}' = execute
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = '${{ needs.plan.outputs.source_sha }}'
          fi
          if test '${{ inputs.execution_mode }}' = resume-publication; then test "$phase" = publication; fi
          pnpm local:release:verify-github-controls \
            --phase "$phase" \
            --tag "$tag" \
            --output "${{ runner.temp }}/breakdown-github-release-controls-execution.json"

      - name: Install and authenticate the pinned keyless tag signer
        shell: bash
        run: |
          set -euo pipefail
          version=0.17.1
          binary="gitsign_${version}_linux_amd64"
          curl --fail --silent --show-error --location "https://github.com/sigstore/gitsign/releases/download/v${version}/${binary}" --output "${{ runner.temp }}/gitsign"
          (cd "${{ runner.temp }}" && printf '69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae  gitsign\n' | sha256sum --check --strict -)
          chmod 0755 "${{ runner.temp }}/gitsign"
          "${{ runner.temp }}/gitsign" --version
          git config --local gpg.format x509
          git config --local gpg.x509.program "${{ runner.temp }}/gitsign"
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create once or verify the exact keyless signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GITSIGN_TOKEN_PROVIDER: github-actions
        shell: bash
        run: |
          set -euo pipefail
          pnpm local:release:render-tag-message --plan "$PLAN" --authorization "$AUTHORIZATION" --output "${{ runner.temp }}/tag-message"
          tag='${{ needs.plan.outputs.tag }}'
          mode='${{ inputs.execution_mode }}'
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          else
            test "$mode" = execute
            git tag --sign --annotate "$tag" '${{ needs.plan.outputs.source_sha }}' --file "${{ runner.temp }}/tag-message"
            git push origin "refs/tags/${tag}:refs/tags/${tag}"
          fi
          test "$(git rev-list -n 1 "$tag")" = '${{ needs.plan.outputs.source_sha }}'
          "${{ runner.temp }}/gitsign" verify \
            --certificate-identity 'https://github.com/alamorre/breakdown.sh/.github/workflows/local-release-ceremony.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$tag" > "${{ runner.temp }}/gitsign-verification.log" 2>&1
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > "${{ runner.temp }}/tag-ref.json"
          tag_object_url="$(jq -er 'select(.object.type == "tag") | .object.url' "${{ runner.temp }}/tag-ref.json")"
          gh api "$tag_object_url" > "${{ runner.temp }}/annotated-tag.json"
          test "$(jq -r '.object.sha' "${{ runner.temp }}/annotated-tag.json")" = '${{ needs.plan.outputs.source_sha }}'
          actual_message="$(jq -r '.message' "${{ runner.temp }}/annotated-tag.json")"
          if test "$mode" = execute; then
            test "$actual_message" = "$(cat "${{ runner.temp }}/tag-message")"
          else
            test "$mode" = resume-publication
            rg --fixed-strings --line-regexp "candidate-digest-sha256: ${{ needs.plan.outputs.candidate_digest }}" <<< "$actual_message"
            rg --fixed-strings --line-regexp "candidate-checksum-inventory-sha256: ${{ needs.plan.outputs.candidate_checksum_inventory_sha256 }}" <<< "$actual_message"
            rg --fixed-strings --line-regexp 'candidate-artifact-id: ${{ inputs.candidate_artifact_id }}' <<< "$actual_message"
            rg --fixed-strings --line-regexp 'platform-index-artifact-id: ${{ inputs.platform_index_artifact_id }}' <<< "$actual_message"
          fi

      - name: Dispatch, await, and resolve the exact host-support artifact
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.plan.outputs.tag }}'
          title="Breakdown Local host support for ceremony ${GITHUB_RUN_ID}"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/323419478/runs?event=workflow_dispatch&branch=${tag}&per_page=100")"
          count="$(jq --arg title "$title" '[.workflow_runs[] | select(.display_title == $title)] | length' <<< "$runs")"
          test "$count" -le 1
          if test "$count" -eq 0; then
            gh workflow run 323419478 --ref "$tag" \
              -f candidate_artifact_id='${{ inputs.candidate_artifact_id }}' \
              -f ceremony_run_id="$GITHUB_RUN_ID"
          fi
          run_id=''
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/323419478/runs?event=workflow_dispatch&branch=${tag}&per_page=100")"
            mapfile -t ids < <(jq -r --arg title "$title" '.workflow_runs[] | select(.display_title == $title) | .id' <<< "$runs")
            test "${#ids[@]}" -le 1
            if test "${#ids[@]}" -eq 1; then run_id="${ids[0]}"; break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
          mapfile -t artifact_ids < <(jq -r '.artifacts[] | select(.name == "breakdown-host-support" and .expired == false) | .id' <<< "$artifacts")
          test "${#artifact_ids[@]}" -eq 1
          printf 'artifact_id=%s\n' "${artifact_ids[0]}" >> "$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Dispatch and await stable publication with no copied evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.plan.outputs.tag }}'
          title="Breakdown Local stable publication for ceremony ${GITHUB_RUN_ID}"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/323419480/runs?event=workflow_dispatch&branch=${tag}&per_page=100")"
          count="$(jq --arg title "$title" '[.workflow_runs[] | select(.display_title == $title)] | length' <<< "$runs")"
          test "$count" -le 1
          if test "$count" -eq 0; then
            args=(
              -f candidate_artifact_id='${{ inputs.candidate_artifact_id }}'
              -f platform_index_artifact_id='${{ inputs.platform_index_artifact_id }}'
              -f host_support_artifact_id='${{ steps.host.outputs.artifact_id }}'
              -f authorization_artifact_id='${{ needs.authorize.outputs.authorization_artifact_id }}'
              -f ceremony_run_id="$GITHUB_RUN_ID"
              -f npm_publication_mode='${{ inputs.npm_publication_mode }}'
              -f npm_trusted_publishing_artifact_id='${{ inputs.npm_trusted_publishing_artifact_id }}'
              -f npm_bootstrap_artifact_id='${{ inputs.npm_bootstrap_artifact_id }}'
            )
            if test '${{ inputs.npm_publication_mode }}' = first-package-bootstrap; then
              args+=(-f npm_bootstrap_confirmation='CREATE EXACT @breakdown-sh/core @breakdown-sh/cli @breakdown-sh/mcp 1.0.0')
            fi
            gh workflow run 323419480 --ref "$tag" "${args[@]}"
          fi
          run_id=''
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/323419480/runs?event=workflow_dispatch&branch=${tag}&per_page=100")"
            mapfile -t ids < <(jq -r --arg title "$title" '.workflow_runs[] | select(.display_title == $title) | .id' <<< "$runs")
            test "${#ids[@]}" -le 1
            if test "${#ids[@]}" -eq 1; then run_id="${ids[0]}"; break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
          printf '## Release ceremony complete\n\nHost support run: `%s`. Stable publication run: `%s`. Exact tag: `%s`.\n' \
            '${{ steps.host.outputs.run_id }}' "$run_id" "$tag" >> "$GITHUB_STEP_SUMMARY"

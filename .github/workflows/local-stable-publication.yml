name: Breakdown Local stable publication
run-name: Breakdown Local stable publication for ceremony ${{ inputs.ceremony_run_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_artifact_id:
        description: Immutable artifact ID for the exact once-built candidate
        required: true
        type: string
      platform_index_artifact_id:
        description: Immutable artifact ID for the passing platform evidence index
        required: true
        type: string
      host_support_artifact_id:
        description: Immutable artifact ID for the authenticated host policy, support material, and attestation
        required: true
        type: string
      authorization_artifact_id:
        description: Immutable attested GitHub authorization artifact from the parent ceremony
        required: true
        type: string
      ceremony_run_id:
        description: Parent release ceremony run ID bound into the authorization and tag
        required: true
        type: string
      npm_publication_mode:
        description: OIDC steady state, one-time first-package bootstrap, or bootstrap finalization
        required: true
        default: oidc-trusted-publishing
        type: choice
        options:
          - oidc-trusted-publishing
          - first-package-bootstrap
          - finalize-bootstrap
      npm_bootstrap_confirmation:
        description: Exact destructive confirmation required only for first-package-bootstrap
        required: false
        type: string
      npm_trusted_publishing_artifact_id:
        description: Immutable sanitized trust inspection artifact required outside bootstrap creation
        required: false
        type: string
      npm_bootstrap_artifact_id:
        description: Immutable successful bootstrap evidence artifact ID required for finalization
        required: false
        type: string

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: breakdown-local-stable-publication
  cancel-in-progress: false

jobs:
  gate-publish-and-verify:
    name: Gate, publish, and verify the exact stable release
    if: ${{ startsWith(github.ref, 'refs/tags/breakdown-local-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: breakdown-local-stable
    steps:
      - name: Check out the signed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install exact Node and configure the public npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false

      - name: Require an npm CLI that supports OIDC trusted publishing
        run: |
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)" "$(npm --version)"

      - name: Install only the locked release gate
        run: pnpm install --frozen-lockfile

      - name: Resolve immutable artifact source runs before downloading bytes
        env:
          AUTHORIZATION_ARTIFACT_ID: ${{ inputs.authorization_artifact_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CEREMONY_RUN_ID: ${{ inputs.ceremony_run_id }}
          GH_TOKEN: ${{ github.token }}
          HOST_SUPPORT_ARTIFACT_ID: ${{ inputs.host_support_artifact_id }}
          NPM_BOOTSTRAP_ARTIFACT_ID: ${{ inputs.npm_bootstrap_artifact_id }}
          NPM_TRUSTED_PUBLISHING_ARTIFACT_ID: ${{ inputs.npm_trusted_publishing_artifact_id }}
          PLATFORM_INDEX_ARTIFACT_ID: ${{ inputs.platform_index_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_artifact_run() {
            local artifact_id="$1"
            local expected_name="$2"
            local name_match="${3:-exact}"
            local metadata="${{ runner.temp }}/artifact-${artifact_id}.json"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "$metadata"
            jq -e \
              --arg id "$artifact_id" \
              --arg name "$expected_name" \
              --arg name_match "$name_match" \
              --arg source_sha "$GITHUB_SHA" \
              '(.id | tostring) == $id and (if $name_match == "prefix" then (.name | startswith($name)) else .name == $name end) and .expired == false and .workflow_run.head_sha == $source_sha' \
              "$metadata" > /dev/null
            jq -er '.workflow_run.id | tostring' "$metadata"
          }

          candidate_run_id="$(resolve_artifact_run "$CANDIDATE_ARTIFACT_ID" breakdown-local-candidate)"
          platform_run_id="$(resolve_artifact_run "$PLATFORM_INDEX_ARTIFACT_ID" breakdown-platform-evidence-index)"
          test "$candidate_run_id" = "$platform_run_id"
          printf 'CANDIDATE_RUN_ID=%s\n' "$candidate_run_id" >> "$GITHUB_ENV"
          printf 'PLATFORM_INDEX_RUN_ID=%s\n' "$platform_run_id" >> "$GITHUB_ENV"

          host_run_id="$(resolve_artifact_run "$HOST_SUPPORT_ARTIFACT_ID" breakdown-host-support)"
          authorization_run_id="$(resolve_artifact_run "$AUTHORIZATION_ARTIFACT_ID" "breakdown-release-authorization-${CEREMONY_RUN_ID}")"
          test "$authorization_run_id" = "$CEREMONY_RUN_ID"
          printf 'HOST_SUPPORT_RUN_ID=%s\n' "$host_run_id" >> "$GITHUB_ENV"
          printf 'AUTHORIZATION_RUN_ID=%s\n' "$authorization_run_id" >> "$GITHUB_ENV"

          if test '${{ inputs.npm_publication_mode }}' != first-package-bootstrap; then
            trust_run_id="$(resolve_artifact_run "$NPM_TRUSTED_PUBLISHING_ARTIFACT_ID" breakdown-npm-trusted-publishing)"
            printf 'NPM_TRUST_RUN_ID=%s\n' "$trust_run_id" >> "$GITHUB_ENV"
          fi
          if test '${{ inputs.npm_publication_mode }}' = finalize-bootstrap; then
            bootstrap_run_id="$(resolve_artifact_run "$NPM_BOOTSTRAP_ARTIFACT_ID" breakdown-npm-first-package-bootstrap- prefix)"
            printf 'NPM_BOOTSTRAP_RUN_ID=%s\n' "$bootstrap_run_id" >> "$GITHUB_ENV"
          fi

      - name: Download the exact once-built candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          path: ${{ runner.temp }}/candidate

      - name: Download the passing platform index by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.platform_index_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.PLATFORM_INDEX_RUN_ID }}
          path: ${{ runner.temp }}/platform-index

      - name: Download the authenticated host support set by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.host_support_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.HOST_SUPPORT_RUN_ID }}
          path: ${{ runner.temp }}/host-support

      - name: Download the exact GitHub-authenticated release authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.authorization_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.AUTHORIZATION_RUN_ID }}
          path: ${{ runner.temp }}/authorization

      - name: Download the sanitized npm trusted-publisher inspection by artifact ID
        if: ${{ inputs.npm_publication_mode != 'first-package-bootstrap' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.npm_trusted_publishing_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.NPM_TRUST_RUN_ID }}
          path: ${{ runner.temp }}/npm-trust

      - name: Download the authenticated first-package bootstrap evidence by artifact ID
        if: ${{ inputs.npm_publication_mode == 'finalize-bootstrap' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.npm_bootstrap_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.NPM_BOOTSTRAP_RUN_ID }}
          path: ${{ runner.temp }}/npm-bootstrap

      - name: Resolve the one exact input of each kind
        env:
          NPM_BOOTSTRAP_ARTIFACT_ID: ${{ inputs.npm_bootstrap_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_one() {
            local root="$1"
            local name="$2"
            mapfile -t matches < <(find "$root" -type f -name "$name" -print)
            test "${#matches[@]}" -eq 1
            printf '%s' "${matches[0]}"
          }
          printf 'CANDIDATE_DIR=%s\n' "${{ runner.temp }}/candidate" >> "$GITHUB_ENV"
          printf 'PLATFORM_INDEX=%s\n' "$(resolve_one "${{ runner.temp }}/platform-index" breakdown-platform-evidence-index.json)" >> "$GITHUB_ENV"
          printf 'HOST_INDEX=%s\n' "$(resolve_one "${{ runner.temp }}/host-support" breakdown-host-support-index.json)" >> "$GITHUB_ENV"
          printf 'HOST_SUPPORT_DIR=%s\n' "$(dirname "$(resolve_one "${{ runner.temp }}/host-support" breakdown-host-support-index.attestation.json)")" >> "$GITHUB_ENV"
          printf 'PUBLICATION_DIR=%s\n' "${{ runner.temp }}/publication" >> "$GITHUB_ENV"
          printf 'VERIFICATION_DIR=%s\n' "${{ runner.temp }}/post-publication" >> "$GITHUB_ENV"
          printf 'VERIFICATION_REPORT=%s\n' "${{ runner.temp }}/breakdown-post-publication-inspection.json" >> "$GITHUB_ENV"
          printf 'NPM_CONTROLS=%s\n' "${{ runner.temp }}/breakdown-npm-publication-controls.json" >> "$GITHUB_ENV"
          printf 'NPM_BOOTSTRAP_REPORT=%s\n' "${{ runner.temp }}/breakdown-npm-first-package-bootstrap.json" >> "$GITHUB_ENV"
          printf 'NPM_BOOTSTRAP_EVIDENCE_DIR=%s\n' "${{ runner.temp }}/npm-bootstrap-evidence" >> "$GITHUB_ENV"
          printf 'AUTHORIZATION=%s\n' "$(resolve_one "${{ runner.temp }}/authorization" breakdown-github-release-authorization.json)" >> "$GITHUB_ENV"
          printf 'AUTHORIZATION_ATTESTATION=%s\n' "$(resolve_one "${{ runner.temp }}/authorization" breakdown-github-release-authorization.attestation.json)" >> "$GITHUB_ENV"
          printf 'AUTHORIZATION_VERIFICATION=%s\n' "${{ runner.temp }}/breakdown-github-release-authorization-verification.json" >> "$GITHUB_ENV"
          printf 'GITHUB_CONTROLS=%s\n' "${{ runner.temp }}/breakdown-github-release-controls.json" >> "$GITHUB_ENV"
          printf 'WORKFLOW_IDENTITY=%s\n' "${{ runner.temp }}/breakdown-stable-workflow-identity.json" >> "$GITHUB_ENV"
          if test '${{ inputs.npm_publication_mode }}' != first-package-bootstrap; then
            printf 'NPM_TRUST_EVIDENCE=%s\n' "$(resolve_one "${{ runner.temp }}/npm-trust" breakdown-npm-trusted-publishing.json)" >> "$GITHUB_ENV"
            printf 'NPM_TRUST_ATTESTATION=%s\n' "$(resolve_one "${{ runner.temp }}/npm-trust" breakdown-npm-trusted-publishing.attestation.json)" >> "$GITHUB_ENV"
          fi
          if test "${{ inputs.npm_publication_mode }}" = finalize-bootstrap; then
            test -n "$NPM_BOOTSTRAP_ARTIFACT_ID"
            printf 'DOWNLOADED_NPM_BOOTSTRAP_REPORT=%s\n' "$(resolve_one "${{ runner.temp }}/npm-bootstrap" breakdown-npm-first-package-bootstrap.json)" >> "$GITHUB_ENV"
            printf 'DOWNLOADED_NPM_BOOTSTRAP_ATTESTATION=%s\n' "$(resolve_one "${{ runner.temp }}/npm-bootstrap" breakdown-npm-first-package-bootstrap.attestation.json)" >> "$GITHUB_ENV"
          fi

      - name: Validate the explicitly selected npm publication mode
        env:
          BOOTSTRAP_ARTIFACT_ID: ${{ inputs.npm_bootstrap_artifact_id }}
          BOOTSTRAP_CONFIRMATION: ${{ inputs.npm_bootstrap_confirmation }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          AUTHORIZATION_ARTIFACT_ID: ${{ inputs.authorization_artifact_id }}
          CEREMONY_RUN_ID: ${{ inputs.ceremony_run_id }}
          HOST_SUPPORT_ARTIFACT_ID: ${{ inputs.host_support_artifact_id }}
          PLATFORM_INDEX_ARTIFACT_ID: ${{ inputs.platform_index_artifact_id }}
          TRUST_EVIDENCE_ARTIFACT_ID: ${{ inputs.npm_trusted_publishing_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          mode='${{ inputs.npm_publication_mode }}'
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORIZATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CEREMONY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HOST_SUPPORT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLATFORM_INDEX_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          if test "$mode" = first-package-bootstrap; then
            test "$GITHUB_REF_NAME" = breakdown-local-v1.0.0
            test "$BOOTSTRAP_CONFIRMATION" = 'CREATE EXACT @breakdown-sh/core @breakdown-sh/cli @breakdown-sh/mcp 1.0.0'
            test -z "$BOOTSTRAP_ARTIFACT_ID"
            test -z "$TRUST_EVIDENCE_ARTIFACT_ID"
          elif test "$mode" = finalize-bootstrap; then
            test -z "$BOOTSTRAP_CONFIRMATION"
            [[ "$BOOTSTRAP_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$TRUST_EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          else
            test -z "$BOOTSTRAP_CONFIRMATION"
            test -z "$BOOTSTRAP_ARTIFACT_ID"
            [[ "$TRUST_EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          fi

      - name: Validate the sanitized npm trusted-publisher inspection
        if: ${{ inputs.npm_publication_mode != 'first-package-bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema_version == "breakdown.npm-trusted-publishing.v1" and .credential_material_retained == false' "$NPM_TRUST_EVIDENCE"
          gh attestation verify "$NPM_TRUST_EVIDENCE" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$NPM_TRUST_ATTESTATION" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/local-npm-trust-inspection.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Reinspect the downloaded candidate without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          pnpm local:release:inspect --candidate "$CANDIDATE_DIR"
          mapfile -t manifests < <(find "$CANDIDATE_DIR" -maxdepth 1 -type f -name 'breakdown-release-*.json' -print)
          test "${#manifests[@]}" -eq 1
          printf 'CANDIDATE_DIGEST=%s\n' "$(jq -r '.platform_conformance.current_build.candidate_digest.content' "${manifests[0]}")" >> "$GITHUB_ENV"
          printf 'CANDIDATE_CHECKSUM_INVENTORY_SHA256=%s\n' "$(sha256sum "$CANDIDATE_DIR/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Verify the exact GitHub-authenticated release authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "$AUTHORIZATION" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$AUTHORIZATION_ATTESTATION" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/local-release-ceremony.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          jq -e \
            --arg candidate_artifact_id '${{ inputs.candidate_artifact_id }}' \
            --arg candidate_digest "$CANDIDATE_DIGEST" \
            --arg ceremony_run_id '${{ inputs.ceremony_run_id }}' \
            --arg mode '${{ inputs.npm_publication_mode }}' \
            --arg platform_index_artifact_id '${{ inputs.platform_index_artifact_id }}' \
            --arg source_sha "$GITHUB_SHA" \
            '.schema_version == "breakdown.github-release-authorization.v1" and
             .approver.github_login == "alamorre" and
             .github_review.state == "approved" and
             .github_review.workflow_run_id == $ceremony_run_id and
             .plan.value.source.git_commit == $source_sha and
             .plan.value.candidate.digest.content == $candidate_digest and
             .plan.value.artifact_ids.candidate == $candidate_artifact_id and
             .plan.value.artifact_ids.platform_index == $platform_index_artifact_id and
             .plan.value.npm_publication_mode == $mode and
             .verification.github_authenticated_review == true and
             .verification.automation_did_not_approve == true' "$AUTHORIZATION"
          jq -n \
            --arg authorization_sha256 "$(sha256sum "$AUTHORIZATION" | cut -d' ' -f1)" \
            --arg attestation_sha256 "$(sha256sum "$AUTHORIZATION_ATTESTATION" | cut -d' ' -f1)" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_digest "$GITHUB_SHA" \
            '{
              schema_version: "breakdown.github-release-authorization-verification.v1",
              repository: $repository,
              authorization: {sha256: $authorization_sha256},
              attestation: {
                sha256: $attestation_sha256,
                signer_workflow: "alamorre/breakdown.sh/.github/workflows/local-release-ceremony.yml",
                source_ref: "refs/heads/main",
                source_digest: $source_digest,
                github_hosted_runner: true
              },
              verification: {status: "passed"}
            }' > "$AUTHORIZATION_VERIFICATION"

      - name: Re-read every GitHub publication control
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CONTROL_READ_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm local:release:verify-github-controls \
            --phase publication \
            --tag "$GITHUB_REF_NAME" \
            --output "$GITHUB_CONTROLS"

      - name: Prove the GitHub-hosted runner and npm OIDC subject boundary
        env:
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          HOST_SUPPORT_ARTIFACT_ID: ${{ inputs.host_support_artifact_id }}
          PLATFORM_INDEX_ARTIFACT_ID: ${{ inputs.platform_index_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = 'github-actions[bot]'
          [[ "$GITHUB_TRIGGERING_ACTOR" = 'github-actions[bot]' || "$GITHUB_TRIGGERING_ACTOR" = alamorre ]]
          test "$RUNNER_ENVIRONMENT" = github-hosted
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          oidc_token="$(jq -er '.value' <<< "$oidc_response")"
          OIDC_TOKEN="$oidc_token" node -e '
            const payload = process.env.OIDC_TOKEN.split(".")[1];
            process.stdout.write(`${Buffer.from(payload, "base64url").toString("utf8")}\n`);
          ' > "${{ runner.temp }}/oidc-claims.json"
          jq -e \
            --arg audience 'npm:registry.npmjs.org' \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg subject 'repo:alamorre/breakdown.sh:environment:breakdown-local-stable' \
            '.aud == $audience and .sub == $subject and .ref == $ref and .sha == $sha and .runner_environment == "github-hosted"' \
            "${{ runner.temp }}/oidc-claims.json"
          jq -n \
            --arg actor "$GITHUB_ACTOR" \
            --arg authorization_verification_sha256 "$(sha256sum "$AUTHORIZATION_VERIFICATION" | cut -d' ' -f1)" \
            --arg candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg controls_sha256 "$(sha256sum "$GITHUB_CONTROLS" | cut -d' ' -f1)" \
            --arg environment 'breakdown-local-stable' \
            --arg host_support_artifact_id "$HOST_SUPPORT_ARTIFACT_ID" \
            --arg platform_index_artifact_id "$PLATFORM_INDEX_ARTIFACT_ID" \
            --arg ref "$GITHUB_REF" \
            --arg ref_name "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runner_environment "$RUNNER_ENVIRONMENT" \
            --arg source_commit "$GITHUB_SHA" \
            --arg triggering_actor "$GITHUB_TRIGGERING_ACTOR" \
            --argjson ruleset_id 20015652 \
            --slurpfile oidc "${{ runner.temp }}/oidc-claims.json" \
            '{
              schema_version: "breakdown.stable-workflow-identity.v1",
              repository: $repository,
              ref: $ref,
              ref_name: $ref_name,
              source_commit: $source_commit,
              actor: $actor,
              triggering_actor: $triggering_actor,
              environment: $environment,
              runner_environment: $runner_environment,
              oidc: {
                subject: $oidc[0].sub,
                audience: $oidc[0].aud,
                job_workflow_ref: $oidc[0].job_workflow_ref
              },
              artifact_ids: {
                candidate: $candidate_artifact_id,
                platform_index: $platform_index_artifact_id,
                host_support: $host_support_artifact_id
              },
              release_controls: {
                ruleset_id: $ruleset_id,
                snapshot_sha256: $controls_sha256
              },
              authorization_verification_sha256: $authorization_verification_sha256
            }' > "$WORKFLOW_IDENTITY"

      - name: Install the pinned keyless tag verifier
        shell: bash
        run: |
          set -euo pipefail
          version=0.17.1
          binary="gitsign_${version}_linux_amd64"
          curl --fail --silent --show-error --location "https://github.com/sigstore/gitsign/releases/download/v${version}/${binary}" --output "${{ runner.temp }}/gitsign"
          (cd "${{ runner.temp }}" && printf '69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae  gitsign\n' | sha256sum --check --strict -)
          chmod 0755 "${{ runner.temp }}/gitsign"
          git config --local gpg.format x509
          git config --local gpg.x509.program "${{ runner.temp }}/gitsign"

      - name: Verify the candidate-bound keyless tag and strict protection ruleset
        env:
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          GH_TOKEN: ${{ github.token }}
          PLATFORM_INDEX_ARTIFACT_ID: ${{ inputs.platform_index_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          "${{ runner.temp }}/gitsign" verify \
            --certificate-identity 'https://github.com/alamorre/breakdown.sh/.github/workflows/local-release-ceremony.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$GITHUB_REF_NAME" > "${{ runner.temp }}/gitsign-verification.log" 2>&1
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          test "$(jq -r '.object.type' <<< "$tag_ref")" = tag
          tag_object_url="$(jq -r '.object.url' <<< "$tag_ref")"
          gh api "$tag_object_url" > "${{ runner.temp }}/annotated-tag.json"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "${{ runner.temp }}/annotated-tag.json"
          tag_message="$(jq -r '.message' "${{ runner.temp }}/annotated-tag.json")"
          rg --fixed-strings --line-regexp "candidate-digest-sha256: ${CANDIDATE_DIGEST}" <<< "$tag_message"
          rg --fixed-strings --line-regexp "candidate-checksum-inventory-sha256: ${CANDIDATE_CHECKSUM_INVENTORY_SHA256}" <<< "$tag_message"
          rg --fixed-strings --line-regexp "candidate-artifact-id: ${CANDIDATE_ARTIFACT_ID}" <<< "$tag_message"
          rg --fixed-strings --line-regexp "platform-index-artifact-id: ${PLATFORM_INDEX_ARTIFACT_ID}" <<< "$tag_message"
          rg --regexp '^release-ceremony-run-id: [1-9][0-9]*$' <<< "$tag_message"
          rg --regexp '^release-plan-sha256: [0-9a-f]{64}$' <<< "$tag_message"
          rg --regexp '^release-authorization-sha256: [0-9a-f]{64}$' <<< "$tag_message"
          jq \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg platform_index_artifact_id "$PLATFORM_INDEX_ARTIFACT_ID" \
            --slurpfile controls "$GITHUB_CONTROLS" \
            '{
              schema_version: "breakdown.signed-tag-evidence.v1",
              repository: $repository,
              tag,
              tag_object_sha: .sha,
              target: .object,
              message,
              artifact_ids: {
                candidate: $candidate_artifact_id,
                platform_index: $platform_index_artifact_id
              },
              verification: {
                verified: true,
                reason: "sigstore-keyless-valid"
              },
              signer: {
                method: "sigstore-keyless-gitsign",
                gitsign_version: "0.17.1",
                binary_sha256: "69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae",
                certificate_identity: "https://github.com/alamorre/breakdown.sh/.github/workflows/local-release-ceremony.yml@refs/heads/main",
                certificate_oidc_issuer: "https://token.actions.githubusercontent.com",
                transparency_log: "https://rekor.sigstore.dev",
                signature_verified: true,
                certificate_claims_verified: true,
                transparency_log_verified: true
              },
              protection: {
                ruleset_id: $controls[0].tag_ruleset.id,
                name: $controls[0].tag_ruleset.name,
                target: $controls[0].tag_ruleset.target,
                enforcement: $controls[0].tag_ruleset.enforcement,
                conditions: $controls[0].tag_ruleset.conditions,
                rules: $controls[0].tag_ruleset.rules,
                bypass_actors: $controls[0].tag_ruleset.bypass_actors,
                current_user_can_bypass: $controls[0].tag_ruleset.current_user_can_bypass
              }
            }' \
            "${{ runner.temp }}/annotated-tag.json" \
            > "${{ runner.temp }}/breakdown-signed-tag-evidence.json"
          jq -e '.verification.verified == true and .signer.certificate_claims_verified == true' "${{ runner.temp }}/breakdown-signed-tag-evidence.json"

      - name: Verify the host index Sigstore attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$HOST_INDEX" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$HOST_SUPPORT_DIR/breakdown-host-support-index.attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/local-host-support.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Verify the retained first-package bootstrap attestation
        if: ${{ inputs.npm_publication_mode == 'finalize-bootstrap' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$DOWNLOADED_NPM_BOOTSTRAP_REPORT" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$DOWNLOADED_NPM_BOOTSTRAP_ATTESTATION" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/local-stable-publication.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Require removal of the one-time GitHub bootstrap secret
        if: ${{ inputs.npm_publication_mode != 'first-package-bootstrap' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CONTROL_READ_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/breakdown-local-stable/secrets?per_page=100" \
            | jq -e --arg name NPM_FIRST_PACKAGE_TOKEN 'all(.secrets[]?; .name != $name)'

      - name: Bind the selected npm authentication path to the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --mode '${{ inputs.npm_publication_mode }}'
            --candidate "$CANDIDATE_DIR"
            --output "$NPM_CONTROLS"
          )
          if test '${{ inputs.npm_publication_mode }}' != first-package-bootstrap; then
            args+=(--trusted-publishing "$NPM_TRUST_EVIDENCE")
          fi
          if test '${{ inputs.npm_publication_mode }}' = finalize-bootstrap; then
            args+=(--bootstrap-evidence "$DOWNLOADED_NPM_BOOTSTRAP_REPORT")
          fi
          pnpm local:release:prepare-npm "${args[@]}"

      - name: Gate and assemble the complete stable publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$PUBLICATION_DIR"
          args=(
            --candidate "$CANDIDATE_DIR"
            --platform-index "$PLATFORM_INDEX"
            --host-support-index "$HOST_INDEX"
            --host-support "$HOST_SUPPORT_DIR"
            --authorization "$AUTHORIZATION"
            --authorization-attestation "$AUTHORIZATION_ATTESTATION"
            --authorization-verification "$AUTHORIZATION_VERIFICATION"
            --github-controls "$GITHUB_CONTROLS"
            --tag-evidence "${{ runner.temp }}/breakdown-signed-tag-evidence.json"
            --workflow-identity "$WORKFLOW_IDENTITY"
            --npm-controls "$NPM_CONTROLS"
            --output "$PUBLICATION_DIR"
          )
          if test '${{ inputs.npm_publication_mode }}' = finalize-bootstrap; then
            args+=(
              --npm-bootstrap-report "$DOWNLOADED_NPM_BOOTSTRAP_REPORT"
              --npm-bootstrap-attestation "$DOWNLOADED_NPM_BOOTSTRAP_ATTESTATION"
            )
          fi
          pnpm local:release:prepare-publication "${args[@]}"
          RELEASE_VERSION="$(jq -r '.release_version' "$PUBLICATION_DIR"/breakdown-publication-manifest-*.json)"
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Retain the complete pre-publication gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-stable-release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/breakdown-github-release-controls.json
            ${{ runner.temp }}/authorization/breakdown-github-release-authorization.json
            ${{ runner.temp }}/authorization/breakdown-github-release-authorization.attestation.json
            ${{ runner.temp }}/breakdown-github-release-authorization-verification.json
            ${{ runner.temp }}/breakdown-signed-tag-evidence.json
            ${{ runner.temp }}/breakdown-stable-workflow-identity.json
            ${{ runner.temp }}/breakdown-npm-publication-controls.json
            ${{ runner.temp }}/npm-trust/breakdown-npm-trusted-publishing.json
            ${{ runner.temp }}/npm-bootstrap/breakdown-npm-first-package-bootstrap.json
            ${{ runner.temp }}/npm-bootstrap/breakdown-npm-first-package-bootstrap.attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest every exact publication asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/publication/*

      - name: Reverify the exact bootstrapped npm bytes before finalization
        if: ${{ inputs.npm_publication_mode == 'finalize-bootstrap' }}
        run: pnpm local:release:verify-first-npm-packages --publication "$PUBLICATION_DIR"

      - name: Create the complete GitHub draft
        if: ${{ inputs.npm_publication_mode != 'first-package-bootstrap' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "$PUBLICATION_DIR"/* \
            --draft \
            --latest=false \
            --notes-file "$PUBLICATION_DIR/breakdown-release-notes-${RELEASE_VERSION}.md" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Breakdown Local ${RELEASE_VERSION}" \
            --verify-tag

      - name: Publish the exact inspected npm tarballs with OIDC and provenance
        if: ${{ inputs.npm_publication_mode == 'oidc-trusted-publishing' }}
        shell: bash
        run: |
          npm publish "$PUBLICATION_DIR/breakdown-sh-core-${RELEASE_VERSION}.tgz" --access public --tag latest --provenance
          npm publish "$PUBLICATION_DIR/breakdown-sh-cli-${RELEASE_VERSION}.tgz" --access public --tag latest --provenance
          npm publish "$PUBLICATION_DIR/breakdown-sh-mcp-${RELEASE_VERSION}.tgz" --access public --tag latest --provenance

      - name: Create the three first npm package records with the one-time credential
        if: ${{ inputs.npm_publication_mode == 'first-package-bootstrap' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PACKAGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          pnpm local:release:publish-first-npm-packages \
            --publication "$PUBLICATION_DIR" \
            --output "$NPM_BOOTSTRAP_REPORT"

      - name: Attest the sanitized first-package bootstrap result
        if: ${{ inputs.npm_publication_mode == 'first-package-bootstrap' }}
        id: attest-npm-bootstrap
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/breakdown-npm-first-package-bootstrap.json

      - name: Assemble the authenticated first-package bootstrap evidence
        if: ${{ inputs.npm_publication_mode == 'first-package-bootstrap' }}
        run: |
          mkdir "$NPM_BOOTSTRAP_EVIDENCE_DIR"
          cp "$NPM_BOOTSTRAP_REPORT" "$NPM_BOOTSTRAP_EVIDENCE_DIR/breakdown-npm-first-package-bootstrap.json"
          cp "${{ steps.attest-npm-bootstrap.outputs.bundle-path }}" "$NPM_BOOTSTRAP_EVIDENCE_DIR/breakdown-npm-first-package-bootstrap.attestation.json"

      - name: Retain the authenticated first-package bootstrap evidence
        if: ${{ inputs.npm_publication_mode == 'first-package-bootstrap' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-npm-first-package-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-bootstrap-evidence/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish the ordinary immutable GitHub Release
        if: ${{ inputs.npm_publication_mode != 'first-package-bootstrap' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --prerelease=false \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag

      - name: Verify every public byte and trust record
        if: ${{ inputs.npm_publication_mode != 'first-package-bootstrap' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$VERIFICATION_DIR"
          pnpm local:release:verify-publication \
            --publication "$PUBLICATION_DIR" \
            --repository "$GITHUB_REPOSITORY" \
            --work "$VERIFICATION_DIR" \
            --output "$VERIFICATION_REPORT"

      - name: Retain the final post-publication inspection
        if: ${{ inputs.npm_publication_mode != 'first-package-bootstrap' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-post-publication-inspection-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/breakdown-post-publication-inspection.json
          if-no-files-found: error
          retention-days: 90

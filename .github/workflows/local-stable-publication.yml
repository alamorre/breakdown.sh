name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: breakdown-local-stable
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node and npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install a trusted-publishing npm version
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          rm -rf packages/breakdown-core/dist packages/breakdown-cli/dist packages/breakdown-mcp/dist
          pnpm --filter @breakdown-sh/core build
          pnpm --filter @breakdown-sh/cli build
          pnpm --filter @breakdown-sh/mcp build

      - name: Pack packages
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          for package_dir in packages/breakdown-core packages/breakdown-cli packages/breakdown-mcp; do
            cp local/contracts/LICENSE local/contracts/NOTICE local/contracts/THIRD_PARTY_NOTICES.md "$package_dir/"
          done
          pnpm --filter @breakdown-sh/core pack --pack-destination "$RUNNER_TEMP/npm-packages"
          pnpm --filter @breakdown-sh/cli pack --pack-destination "$RUNNER_TEMP/npm-packages"
          pnpm --filter @breakdown-sh/mcp pack --pack-destination "$RUNNER_TEMP/npm-packages"

      - name: Publish packages
        run: |
          npm publish "$RUNNER_TEMP"/npm-packages/breakdown-sh-core-*.tgz --access public --tag latest
          npm publish "$RUNNER_TEMP"/npm-packages/breakdown-sh-cli-*.tgz --access public --tag latest
          npm publish "$RUNNER_TEMP"/npm-packages/breakdown-sh-mcp-*.tgz --access public --tag latest

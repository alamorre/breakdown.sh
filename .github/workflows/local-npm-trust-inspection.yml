name: Breakdown Local npm trust inspection
run-name: Breakdown Local sanitized npm trust inspection

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: breakdown-local-npm-trust-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Capture sanitized trusted-publisher evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: breakdown-local-authorization
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install exact Node and public npm registry configuration
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false

      - name: Install the locked trust inspector
        run: pnpm install --frozen-lockfile

      - name: Inspect npm trust without logging or retaining credentials
        env:
          NPM_TRUST_READ_TOKEN: ${{ secrets.NPM_TRUST_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NPM_TRUST_READ_TOKEN"
          npmrc="${{ runner.temp }}/npm-trust-read.npmrc"
          trap 'rm -f "$npmrc"' EXIT
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\n' "$NPM_TRUST_READ_TOKEN" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" pnpm local:release:inspect-npm-trust \
            --output "${{ runner.temp }}/breakdown-npm-trusted-publishing.json"
          rm -f "$npmrc"
          trap - EXIT
          jq -e '.credential_material_retained == false and .verification.status == "passed"' \
            "${{ runner.temp }}/breakdown-npm-trusted-publishing.json"

      - name: Attest the sanitized inspection
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/breakdown-npm-trusted-publishing.json

      - name: Assemble only sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir "${{ runner.temp }}/npm-trust-evidence"
          cp "${{ runner.temp }}/breakdown-npm-trusted-publishing.json" \
            "${{ runner.temp }}/npm-trust-evidence/breakdown-npm-trusted-publishing.json"
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "${{ runner.temp }}/npm-trust-evidence/breakdown-npm-trusted-publishing.attestation.json"

      - name: Retain the sanitized trusted-publisher evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-npm-trusted-publishing
          path: ${{ runner.temp }}/npm-trust-evidence
          if-no-files-found: error
          retention-days: 90

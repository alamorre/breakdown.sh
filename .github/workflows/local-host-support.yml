name: Breakdown Local authenticated host support
run-name: Breakdown Local host support for ceremony ${{ inputs.ceremony_run_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_artifact_id:
        description: Immutable artifact ID for the exact Breakdown Local candidate
        required: true
        type: string
      ceremony_run_id:
        description: Parent release ceremony run ID for retry-safe orchestration
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  index-and-attest:
    name: Attest the deferred empty host support policy
    if: ${{ startsWith(github.ref, 'refs/tags/breakdown-local-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the release-tag indexer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          cache: pnpm
          package-manager-cache: false

      - name: Install locked indexer dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the candidate artifact source run
        env:
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          metadata="${{ runner.temp }}/candidate-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" > "$metadata"
          jq -e \
            --arg id "$CANDIDATE_ARTIFACT_ID" \
            --arg source_sha "$GITHUB_SHA" \
            '(.id | tostring) == $id and .name == "breakdown-local-candidate" and .expired == false and .workflow_run.head_sha == $source_sha' \
            "$metadata"
          printf 'CANDIDATE_RUN_ID=%s\n' "$(jq -er '.workflow_run.id' "$metadata")" >> "$GITHUB_ENV"

      - name: Download the immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          path: ${{ runner.temp }}/breakdown-candidate

      - name: Require guided-host capture to remain disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/324133712" --jq .state)" = disabled_manually

      - name: Generate the candidate, source, and tag-bound deferred support set
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.ceremony_run_id }}' =~ ^[1-9][0-9]*$ ]]
          pnpm local:release:defer-host-support --candidate "${{ runner.temp }}/breakdown-candidate" --tag "$GITHUB_REF_NAME" --output "${{ runner.temp }}/breakdown-host-support-index.json" --support-output "${{ runner.temp }}/breakdown-host-support"

      - name: Attest the exact generated index
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/breakdown-host-support-index.json

      - name: Add the Sigstore bundle to the support set
        run: cp "${{ steps.attest.outputs.bundle-path }}" "${{ runner.temp }}/breakdown-host-support/breakdown-host-support-index.attestation.json"

      - name: Retain the authenticated generated support set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breakdown-host-support
          path: |
            ${{ runner.temp }}/breakdown-host-support-index.json
            ${{ runner.temp }}/breakdown-host-support
          if-no-files-found: error
          retention-days: 90

name: PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - closed

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy-preview:
    name: Deploy Preview
    if: ${{ github.event.action != 'closed' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.metadata.outputs.preview_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PREVIEW_BASE_DOMAIN: ${{ vars.VERCEL_PREVIEW_DOMAIN || secrets.VERCEL_PREVIEW_DOMAIN }}
      PREVIEW_DOMAIN_PREFIX: ${{ vars.VERCEL_PREVIEW_DOMAIN_PREFIX || 'thesis-pr' }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve preview metadata
        id: metadata
        run: node .github/scripts/preview-metadata.mjs

      - name: Require deployment secrets
        run: |
          missing=0
          required=(
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            PREVIEW_BASE_DOMAIN
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            ANTHROPIC_API_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for PR preview deployments."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ steps.metadata.outputs.safe_pr_title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deployment_url="$(vercel deploy --yes --token="$VERCEL_TOKEN" \
            --build-env "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-env "NEXT_PUBLIC_APP_ENV=preview" \
            --build-env "NEXT_PUBLIC_PREVIEW_PR_NUMBER=$PR_NUMBER" \
            --build-env "NEXT_PUBLIC_PREVIEW_PR_TITLE=$PR_TITLE" \
            --build-env "NEXT_PUBLIC_PREVIEW_COMMIT_SHA=$COMMIT_SHA" \
            --build-env "NEXT_PUBLIC_PREVIEW_DATABASE_TARGET=production" \
            --env "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --env "CLERK_SECRET_KEY=$CLERK_SECRET_KEY" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --env "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
            --env "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" \
            --env "NEXT_PUBLIC_APP_ENV=preview" \
            --env "NEXT_PUBLIC_PREVIEW_PR_NUMBER=$PR_NUMBER" \
            --env "NEXT_PUBLIC_PREVIEW_PR_TITLE=$PR_TITLE" \
            --env "NEXT_PUBLIC_PREVIEW_COMMIT_SHA=$COMMIT_SHA" \
            --env "NEXT_PUBLIC_PREVIEW_DATABASE_TARGET=production" \
            --meta "githubPr=$PR_NUMBER" \
            --meta "githubCommitSha=$COMMIT_SHA")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Assign stable preview alias
        run: |
          vercel alias set "${{ steps.deploy.outputs.deployment_url }}" "${{ steps.metadata.outputs.preview_host }}" --token="$VERCEL_TOKEN"

      - name: Smoke check preview
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${{ steps.metadata.outputs.preview_url }}/api/health"

      - name: Comment preview link
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_STATUS: ready
          PREVIEW_URL: ${{ steps.metadata.outputs.preview_url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DATABASE_TARGET: production Supabase
        run: node .github/scripts/comment-preview.mjs

      - name: Comment failed preview
        if: ${{ failure() && steps.metadata.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_STATUS: failed
          PREVIEW_URL: ${{ steps.metadata.outputs.preview_url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DATABASE_TARGET: production Supabase
        run: node .github/scripts/comment-preview.mjs

  cleanup-preview:
    name: Cleanup Preview
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PREVIEW_BASE_DOMAIN: ${{ vars.VERCEL_PREVIEW_DOMAIN || secrets.VERCEL_PREVIEW_DOMAIN }}
      PREVIEW_DOMAIN_PREFIX: ${{ vars.VERCEL_PREVIEW_DOMAIN_PREFIX || 'thesis-pr' }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve preview metadata
        id: metadata
        run: node .github/scripts/preview-metadata.mjs

      - name: Require cleanup secrets
        run: |
          missing=0
          required=(VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PREVIEW_BASE_DOMAIN)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for PR preview cleanup."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Remove stable preview alias
        run: vercel alias rm "${{ steps.metadata.outputs.preview_host }}" --yes --token="$VERCEL_TOKEN" || true

      - name: Mark preview inactive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_STATUS: inactive
          PREVIEW_URL: ${{ steps.metadata.outputs.preview_url }}
          DEPLOYMENT_URL: ''
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DATABASE_TARGET: production Supabase
        run: node .github/scripts/comment-preview.mjs
